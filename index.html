<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Map</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f6fb; color: #1a1a2e; min-height: 100vh; }

    header { background: #185FA5; color: #fff; padding: 1.5rem 2rem; display: flex; align-items: center; gap: 14px; }
    header .globe { font-size: 32px; }
    header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.3px; }
    header p { font-size: 13px; opacity: 0.8; margin-top: 2px; }

    main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

    #search-bar {
      width: 100%; padding: 11px 18px; font-size: 15px;
      border: 2px solid #378ADD; border-radius: 999px;
      background: #fff; color: #1a1a2e; margin-bottom: 1.25rem;
      outline: none; transition: box-shadow 0.15s;
    }
    #search-bar:focus { box-shadow: 0 0 0 4px #B5D4F480; }

    #regions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.75rem; }
    .region-btn {
      font-size: 13px; font-weight: 500; padding: 7px 16px;
      border: 2px solid #d0d8e8; border-radius: 999px;
      background: #fff; color: #555; cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .region-btn:hover { border-color: #378ADD; color: #185FA5; }
    .region-btn.active { color: #fff; border-color: transparent; }
    .region-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }

    .country-card {
      background: #fff; border: 1.5px solid #e2e8f0;
      border-radius: 14px; padding: 14px; cursor: pointer;
      transition: all 0.18s; overflow: hidden;
      border-top-width: 4px;
    }
    .country-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); border-color: #378ADD; }
    .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .card-flag { font-size: 26px; line-height: 1; }
    .cname { font-size: 14px; font-weight: 600; color: #1a1a2e; }
    .clang { font-size: 12px; color: #666; margin-top: 3px; display: flex; align-items: center; gap: 5px; }

    .overlay-bg {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
    }
    .overlay-bg.open { display: flex; }

    .panel {
      background: #fff; border-radius: 20px; padding: 2rem;
      max-width: 420px; width: 92%; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: pop 0.2s ease;
    }
    @keyframes pop { from { transform: scale(0.93); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .panel-header { display: flex; align-items: center; gap: 16px; margin-bottom: 1.5rem; }
    .panel-flag { font-size: 52px; line-height: 1; }
    .panel-outline { width: 68px; height: 56px; flex-shrink: 0; }
    .panel-title h2 { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 5px; }
    .lang-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }

    .info-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; margin-top: 1rem; }
    .info-val { font-size: 22px; font-weight: 700; color: #1a1a2e; }
    .info-script { font-size: 13px; color: #888; margin-top: 3px; }
    .fact-box { border-radius: 12px; padding: 13px 15px; font-size: 13px; line-height: 1.65; margin-top: 6px; }

    #close-btn {
      position: absolute; top: 16px; right: 16px;
      background: #f0f2f5; border: none; width: 32px; height: 32px;
      border-radius: 50%; font-size: 18px; cursor: pointer; color: #555;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
    }
    #close-btn:hover { background: #e0e3ea; }

    #empty { text-align: center; color: #888; font-size: 15px; padding: 4rem 0; display: none; }
    #count { font-size: 13px; color: #888; margin-bottom: 1rem; }
  </style>
</head>
<body>

<header>
  <span class="globe">🌍</span>
  <div>
    <h1>Language Map</h1>
    <p>Click any country to learn its language and how to say hello</p>
  </div>
</header>

<main>
  <input id="search-bar" type="text" placeholder="Search by country or language..." oninput="filterCards()" />
  <div id="regions"></div>
  <div id="count"></div>
  <div id="grid"></div>
  <div id="empty">No countries found. Try a different search.</div>
</main>

<div class="overlay-bg" id="overlay" onclick="handleOverlayClick(event)">
  <div class="panel" id="panel">
    <button id="close-btn" onclick="closePanel()">&#215;</button>
    <div class="panel-header">
      <span id="p-flag" class="panel-flag"></span>
      <svg id="p-outline" class="panel-outline" viewBox="0 0 64 52"></svg>
      <div class="panel-title">
        <h2 id="p-name"></h2>
        <span id="p-badge" class="lang-badge"></span>
      </div>
    </div>
    <div class="info-label">How to say hello</div>
    <div id="p-hello" class="info-val"></div>
    <div id="p-script" class="info-script"></div>
    <div class="info-label">Fun fact</div>
    <div id="p-fact" class="fact-box"></div>
  </div>
</div>

<script>
const regionColors = { Europe:"#534AB7", Asia:"#D85A30", Africa:"#639922", Americas:"#185FA5", Oceania:"#993556" };
const regionLight  = { Europe:"#EEEDFE", Asia:"#FAECE7", Africa:"#EAF3DE", Americas:"#E6F1FB", Oceania:"#FBEAF0" };
const regionDark   = { Europe:"#26215C", Asia:"#4A1B0C", Africa:"#173404", Americas:"#042C53", Oceania:"#4B1528" };

const outlines = {
  France:"M18 8 L30 6 L38 10 L42 18 L38 28 L30 34 L20 32 L12 24 L10 16 Z",
  Spain:"M10 10 L34 8 L42 14 L44 24 L36 32 L20 34 L10 28 L6 18 Z",
  Germany:"M16 6 L32 4 L40 10 L42 20 L36 30 L22 34 L12 28 L10 16 Z",
  Italy:"M20 4 L30 6 L34 14 L32 22 L28 30 L24 40 L20 46 L16 40 L18 30 L14 20 L16 10 Z",
  Portugal:"M16 8 L26 6 L30 14 L28 28 L22 36 L14 32 L12 20 Z",
  Russia:"M4 10 L52 6 L60 14 L58 24 L50 28 L40 26 L30 30 L20 28 L10 24 L4 18 Z",
  Greece:"M18 8 L32 6 L38 14 L36 24 L28 32 L20 34 L14 28 L12 18 Z",
  Poland:"M14 8 L36 6 L42 14 L40 26 L30 32 L16 30 L10 22 Z",
  Romania:"M14 10 L36 8 L42 16 L40 26 L28 32 L14 30 L8 20 Z",
  Japan:"M28 6 L36 10 L38 20 L34 30 L26 34 L20 28 L22 16 Z M14 16 L20 14 L22 22 L16 26 L10 20 Z",
  China:"M8 8 L44 6 L52 12 L54 24 L44 32 L28 36 L12 32 L6 22 Z",
  "South Korea":"M16 10 L34 8 L40 16 L38 26 L28 32 L16 30 L10 20 Z",
  India:"M18 6 L36 8 L42 18 L40 28 L32 38 L24 44 L18 36 L14 24 L16 12 Z",
  Pakistan:"M14 8 L36 6 L42 14 L40 24 L30 30 L16 28 L10 18 Z",
  "Saudi Arabia":"M10 10 L40 8 L46 16 L44 28 L34 34 L16 32 L8 22 Z",
  Turkey:"M8 12 L44 10 L50 18 L46 26 L28 30 L10 28 L6 20 Z",
  Thailand:"M20 6 L32 8 L36 18 L32 28 L26 36 L22 44 L18 36 L16 24 L18 12 Z",
  Indonesia:"M6 14 L30 10 L42 14 L44 22 L34 26 L18 24 L6 20 Z M36 18 L50 16 L56 22 L50 28 L36 26 Z",
  Egypt:"M12 8 L40 8 L42 30 L32 44 L20 44 L10 30 Z",
  Nigeria:"M16 8 L36 8 L42 16 L40 28 L28 34 L14 30 L10 20 Z",
  Ethiopia:"M14 10 L36 8 L44 18 L40 30 L26 36 L12 30 L8 18 Z",
  "South Africa":"M12 8 L40 8 L44 18 L40 30 L32 40 L24 44 L16 40 L8 28 L10 16 Z",
  Kenya:"M18 8 L34 8 L40 16 L38 28 L28 36 L16 32 L10 20 Z",
  Morocco:"M12 8 L36 8 L42 16 L38 28 L24 34 L12 28 L8 18 Z",
  Haiti:"M10 12 L36 10 L40 20 L34 30 L18 32 L8 24 Z",
  Brazil:"M10 6 L42 8 L50 18 L46 32 L36 42 L22 44 L10 36 L6 22 Z",
  Mexico:"M8 12 L40 8 L46 16 L42 26 L28 32 L10 28 L6 20 Z",
  USA:"M6 10 L52 8 L56 18 L50 28 L30 32 L8 28 L4 18 Z",
  Canada:"M4 8 L56 6 L60 16 L52 24 L36 28 L20 26 L6 22 Z",
  Argentina:"M18 6 L34 6 L38 18 L36 32 L28 44 L22 48 L18 40 L16 26 Z",
  Australia:"M8 10 L44 8 L52 18 L48 30 L34 36 L16 34 L6 24 Z",
  "New Zealand":"M22 8 L34 10 L36 20 L30 28 L22 30 L16 22 L18 12 Z M18 34 L28 32 L30 40 L24 46 L16 42 Z",
  "Papua New Guinea":"M16 10 L38 8 L44 16 L40 26 L28 30 L14 26 L10 18 Z",
};

const countries = [
  { name:"France", flag:"🇫🇷", region:"Europe", lang:"French", hello:"Bonjour", script:"bohn-ZHOOR", fact:"French is the only language other than English spoken on 5 continents, and it is an official language in 29 countries." },
  { name:"Spain", flag:"🇪🇸", region:"Europe", lang:"Spanish", hello:"Hola", script:"OH-lah", fact:"Spanish has over 500 million native speakers, making it the world's second most spoken native language." },
  { name:"Germany", flag:"🇩🇪", region:"Europe", lang:"German", hello:"Hallo", script:"HAH-loh", fact:"German has three grammatical genders, and even the word for 'girl' (Mädchen) is neuter, not feminine!" },
  { name:"Italy", flag:"🇮🇹", region:"Europe", lang:"Italian", hello:"Ciao", script:"CHOW", fact:"Italian is the closest living language to Latin and is the official language of classical music notation worldwide." },
  { name:"Portugal", flag:"🇵🇹", region:"Europe", lang:"Portuguese", hello:"Olá", script:"oh-LAH", fact:"Portuguese has around 250 million speakers and is the most widely spoken language in the Southern Hemisphere." },
  { name:"Russia", flag:"🇷🇺", region:"Europe", lang:"Russian", hello:"Привет", script:"pree-VYET", fact:"Russian uses the Cyrillic alphabet, invented in the 9th century. It is the most widely spoken Slavic language in the world." },
  { name:"Greece", flag:"🇬🇷", region:"Europe", lang:"Greek", hello:"Γεια σου", script:"YAH-soo", fact:"Greek is one of the oldest recorded languages, with written records spanning over 3,400 years." },
  { name:"Poland", flag:"🇵🇱", region:"Europe", lang:"Polish", hello:"Cześć", script:"CHESHCH", fact:"Polish uses Latin script but adds unique letters like ł, ą, ę and ź — and has no word for 'the' or 'a'." },
  { name:"Romania", flag:"🇷🇴", region:"Europe", lang:"Romanian", hello:"Bună ziua", script:"BOO-nuh ZEE-wah", fact:"Romanian is a Romance language descended from Latin, making it closely related to French, Italian and Spanish — quite surprising given its location in Eastern Europe." },
  { name:"Japan", flag:"🇯🇵", region:"Asia", lang:"Japanese", hello:"こんにちは", script:"kon-nee-chee-WAH", fact:"Japanese has three writing systems used simultaneously: Hiragana, Katakana, and Kanji (Chinese characters)." },
  { name:"China", flag:"🇨🇳", region:"Asia", lang:"Mandarin", hello:"你好", script:"nee-HOW", fact:"Mandarin Chinese has over 1 billion speakers and uses tones — the same syllable means different things depending on pitch." },
  { name:"South Korea", flag:"🇰🇷", region:"Asia", lang:"Korean", hello:"안녕하세요", script:"ahn-NYONG-ha-se-yo", fact:"The Korean alphabet Hangul was invented in 1443 by King Sejong and can be learned in just a few hours." },
  { name:"India", flag:"🇮🇳", region:"Asia", lang:"Hindi", hello:"नमस्ते", script:"nah-mah-STAY", fact:"India has 22 officially recognised languages and over 19,500 distinct dialects spoken across the country." },
  { name:"Pakistan", flag:"🇵🇰", region:"Asia", lang:"Urdu", hello:"سلام", script:"sah-LAAM", fact:"Urdu is written right to left in the Nastaliq script and shares much of its grammar with Hindi, but draws vocabulary heavily from Persian and Arabic." },
  { name:"Saudi Arabia", flag:"🇸🇦", region:"Asia", lang:"Arabic", hello:"مرحبا", script:"mar-HAH-bah", fact:"Arabic is written right to left and is the liturgical language of Islam, spoken by over 420 million people." },
  { name:"Turkey", flag:"🇹🇷", region:"Asia", lang:"Turkish", hello:"Merhaba", script:"mer-HAH-bah", fact:"Turkish uses vowel harmony — vowels in suffixes must match the vowels of the root word." },
  { name:"Thailand", flag:"🇹🇭", region:"Asia", lang:"Thai", hello:"สวัสดี", script:"sah-WAD-dee", fact:"Thai is a tonal language with 5 tones. It has its own unique script with 44 consonants and 15 vowel symbols." },
  { name:"Indonesia", flag:"🇮🇩", region:"Asia", lang:"Indonesian", hello:"Halo", script:"HAH-loh", fact:"Indonesian has no verb conjugations, no plural forms, and no grammatical gender — making it relatively easy to learn." },
  { name:"Egypt", flag:"🇪🇬", region:"Africa", lang:"Arabic", hello:"أهلاً", script:"AH-lan", fact:"Modern Egyptian Arabic is the most widely understood Arabic dialect due to Egypt's influential film and music industry." },
  { name:"Nigeria", flag:"🇳🇬", region:"Africa", lang:"English / Yoruba", hello:"Bawo ni", script:"BAH-woh-nee (Yoruba)", fact:"Nigeria has over 500 languages, making it one of the most linguistically diverse countries on Earth." },
  { name:"Ethiopia", flag:"🇪🇹", region:"Africa", lang:"Amharic", hello:"ሰላም", script:"sah-LAM", fact:"Amharic uses the Ge'ez script (Ethiopic), one of the world's oldest alphabets still in active use today." },
  { name:"South Africa", flag:"🇿🇦", region:"Africa", lang:"Zulu / 11 official", hello:"Sawubona", script:"sah-woo-BOH-nah", fact:"South Africa has 11 official languages — the most of any country in the world." },
  { name:"Kenya", flag:"🇰🇪", region:"Africa", lang:"Swahili", hello:"Habari", script:"hah-BAR-ee", fact:"Swahili is spoken by over 200 million people across East Africa and was spread by Arab traders centuries ago." },
  { name:"Morocco", flag:"🇲🇦", region:"Africa", lang:"Arabic / Berber", hello:"مرحبا", script:"mar-HAH-bah", fact:"Morocco's Berber language Tamazight was given official status in 2011 and uses the ancient Tifinagh script." },
  { name:"Haiti", flag:"🇭🇹", region:"Americas", lang:"Haitian Creole", hello:"Bonjou", script:"bon-ZHOO", fact:"Haitian Creole developed from French mixed with West African languages and is spoken by virtually all of Haiti's 11 million people as their first language." },
  { name:"Brazil", flag:"🇧🇷", region:"Americas", lang:"Portuguese", hello:"Olá", script:"oh-LAH", fact:"Brazil is the only Portuguese-speaking country in the Americas and has the largest Portuguese-speaking population in the world." },
  { name:"Mexico", flag:"🇲🇽", region:"Americas", lang:"Spanish", hello:"Hola", script:"OH-lah", fact:"Mexico has no official language at the federal level and recognises 68 national languages including 63 indigenous ones." },
  { name:"USA", flag:"🇺🇸", region:"Americas", lang:"English", hello:"Hello", script:"HEH-loh", fact:"The United States has no official national language. English is the de facto language but over 350 languages are spoken there." },
  { name:"Canada", flag:"🇨🇦", region:"Americas", lang:"English / French", hello:"Hello / Bonjour", script:"HEH-loh / bohn-ZHOOR", fact:"Canada is officially bilingual. The province of Quebec is predominantly French-speaking, with French protected by law." },
  { name:"Argentina", flag:"🇦🇷", region:"Americas", lang:"Spanish", hello:"Hola", script:"OH-lah", fact:"Argentinian Spanish uses 'vos' instead of 'tú' and has a distinctive Italian-influenced accent from waves of immigration." },
  { name:"Australia", flag:"🇦🇺", region:"Oceania", lang:"English", hello:"G'day", script:"g-DAY", fact:"Australia has over 250 Indigenous language groups, though many are endangered with fewer than 20 fluent speakers remaining." },
  { name:"New Zealand", flag:"🇳🇿", region:"Oceania", lang:"English / Māori", hello:"Kia ora", script:"KEE-ah-OR-ah", fact:"Māori is a Polynesian language and one of New Zealand's official languages. 'Kia ora' literally means 'be well/healthy'." },
  { name:"Papua New Guinea", flag:"🇵🇬", region:"Oceania", lang:"Tok Pisin", hello:"Gude", script:"GOO-day", fact:"Papua New Guinea has over 800 languages — the most of any country — in a population of just 10 million people." },
];

const regions = ["All","Europe","Asia","Africa","Americas","Oceania"];
let activeRegion = "All", searchVal = "";

const regionsEl = document.getElementById("regions");
const gridEl = document.getElementById("grid");
const emptyEl = document.getElementById("empty");
const countEl = document.getElementById("count");

regions.forEach(r => {
  const btn = document.createElement("button");
  btn.className = "region-btn" + (r === "All" ? " active" : "");
  if (r === "All") {
    btn.textContent = "All regions";
    btn.style.background = "#1a1a2e";
    btn.style.color = "#fff";
    btn.style.borderColor = "#1a1a2e";
  } else {
    btn.innerHTML = `<span class="region-dot" style="background:${regionColors[r]}"></span>${r}`;
  }
  btn.onclick = () => {
    activeRegion = r;
    document.querySelectorAll(".region-btn").forEach(b => {
      b.style.background = "";
      b.style.color = "";
      b.style.borderColor = "";
      b.classList.remove("active");
    });
    btn.classList.add("active");
    if (r === "All") {
      btn.style.background = "#1a1a2e";
      btn.style.color = "#fff";
      btn.style.borderColor = "#1a1a2e";
    } else {
      btn.style.background = regionColors[r];
      btn.style.color = "#fff";
      btn.style.borderColor = regionColors[r];
    }
    renderCards();
  };
  regionsEl.appendChild(btn);
});

function filterCards() {
  searchVal = document.getElementById("search-bar").value.toLowerCase();
  renderCards();
}

function renderCards() {
  gridEl.innerHTML = "";
  const filtered = countries.filter(c => {
    const matchRegion = activeRegion === "All" || c.region === activeRegion;
    const matchSearch = !searchVal || c.name.toLowerCase().includes(searchVal) || c.lang.toLowerCase().includes(searchVal);
    return matchRegion && matchSearch;
  });
  emptyEl.style.display = filtered.length === 0 ? "block" : "none";
  countEl.textContent = filtered.length + " countr" + (filtered.length === 1 ? "y" : "ies");
  filtered.forEach(c => {
    const col = regionColors[c.region];
    const d = outlines[c.name] || "M16 10 L36 8 L42 16 L38 28 L26 32 L14 26 L10 18 Z";
    const card = document.createElement("div");
    card.className = "country-card";
    card.style.borderTopColor = col;
    card.innerHTML = `
      <div class="card-top">
        <span class="card-flag">${c.flag}</span>
        <svg viewBox="0 0 64 52" width="38" height="30" style="display:block">
          <path d="${d}" fill="${regionLight[c.region]}" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="cname">${c.name}</div>
      <div class="clang"><span class="region-dot" style="background:${col}"></span>${c.lang}</div>
    `;
    card.onclick = () => openPanel(c);
    gridEl.appendChild(card);
  });
}

function openPanel(c) {
  const col = regionColors[c.region];
  const lightCol = regionLight[c.region];
  const darkCol = regionDark[c.region];
  const d = outlines[c.name] || "M16 10 L36 8 L42 16 L38 28 L26 32 L14 26 L10 18 Z";
  document.getElementById("p-flag").textContent = c.flag;
  document.getElementById("p-outline").innerHTML = `<path d="${d}" fill="${lightCol}" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>`;
  document.getElementById("p-name").textContent = c.name;
  const badge = document.getElementById("p-badge");
  badge.textContent = c.lang;
  badge.style.background = lightCol;
  badge.style.color = darkCol;
  document.getElementById("p-hello").textContent = c.hello;
  document.getElementById("p-script").textContent = "Pronounced: " + c.script;
  document.getElementById("p-fact").textContent = c.fact;
  const fact = document.getElementById("p-fact");
  fact.style.background = lightCol;
  fact.style.color = darkCol;
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closePanel() {
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById("overlay")) closePanel();
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

renderCards();
</script>
</body>
</html>
