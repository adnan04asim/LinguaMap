<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaMap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; }

    .country-card {
      cursor: pointer;
      border-top: 3px solid #185FA5 !important;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .country-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1) !important;
    }
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
    }
    .popup-overlay.show { display: flex; }
    .popup-panel { animation: popIn 0.2s ease; max-width: 420px; width: 92%; }
    @keyframes popIn {
      from { transform: scale(0.93); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
  </style>
</head>
<body>

<header class="bg-primary text-white py-3 px-4 d-flex align-items-center gap-3 mb-4">
  <span style="font-size:28px;">🌍</span>
  <div>
    <h1 class="h5 mb-0 fw-semibold">LinguaMap</h1>
    <small class="opacity-75">Click any country to learn its language and how to say hello</small>
  </div>
</header>

<main class="container-lg px-4 pb-5">
  <input id="search-bar" type="text" class="form-control rounded-pill mb-3"
    placeholder="Search by country or language..." oninput="filterCards()" />
  <div class="d-flex flex-wrap gap-2 mb-3" id="regions"></div>
  <p id="count" class="text-muted small mb-3"></p>
  <div class="row g-3" id="grid"></div>
  <div id="empty" class="text-center text-muted py-5" style="display:none;">
    No countries found. Try a different search.
  </div>
</main>

<div class="popup-overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="popup-panel bg-white rounded-4 p-4 shadow-lg position-relative">
    <button class="btn-close position-absolute top-0 end-0 m-3" onclick="closePanel()"></button>
    <div class="d-flex align-items-center gap-3 mb-3">
      <span id="p-flag" style="font-size:48px;"></span>
      <div>
        <h2 id="p-name" class="h5 mb-1 fw-semibold"></h2>
        <span id="p-badge" class="badge bg-primary rounded-pill"></span>
      </div>
    </div>
    <p class="text-muted small text-uppercase mb-1" style="letter-spacing:0.06em;">How to say hello</p>
    <p id="p-hello" class="fs-4 fw-semibold mb-1"></p>
    <p id="p-script" class="text-muted small mb-3"></p>
    <p class="text-muted small text-uppercase mb-1" style="letter-spacing:0.06em;">Fun fact</p>
    <div id="p-fact" class="p-3 rounded-3 small bg-primary bg-opacity-10 text-primary"></div>
  </div>
</div>

<script>
const countries = [
  { name:"France", flag:"🇫🇷", region:"Europe", lang:"French", hello:"Bonjour", script:"bohn-ZHOOR", fact:"French is the only language other than English spoken on 5 continents, and it is an official language in 29 countries." },
  { name:"Spain", flag:"🇪🇸", region:"Europe", lang:"Spanish", hello:"Hola", script:"OH-lah", fact:"Spanish has over 500 million native speakers, making it the world's second most spoken native language." },
  { name:"Germany", flag:"🇩🇪", region:"Europe", lang:"German", hello:"Hallo", script:"HAH-loh", fact:"German has three grammatical genders, and even the word for 'girl' (Mädchen) is neuter, not feminine!" },
  { name:"Italy", flag:"🇮🇹", region:"Europe", lang:"Italian", hello:"Ciao", script:"CHOW", fact:"Italian is the closest living language to Latin and is the official language of classical music notation worldwide." },
  { name:"Portugal", flag:"🇵🇹", region:"Europe", lang:"Portuguese", hello:"Olá", script:"oh-LAH", fact:"Portuguese has around 250 million speakers and is the most widely spoken language in the Southern Hemisphere." },
  { name:"Russia", flag:"🇷🇺", region:"Europe", lang:"Russian", hello:"Привет", script:"pree-VYET", fact:"Russian uses the Cyrillic alphabet, invented in the 9th century. It is the most widely spoken Slavic language in the world." },
  { name:"Greece", flag:"🇬🇷", region:"Europe", lang:"Greek", hello:"Γεια σου", script:"YAH-soo", fact:"Greek is one of the oldest recorded languages, with written records spanning over 3,400 years." },
  { name:"Poland", flag:"🇵🇱", region:"Europe", lang:"Polish", hello:"Cześć", script:"CHESHCH", fact:"Polish uses Latin script but adds unique letters like ł, ą, ę and ź — and has no word for 'the' or 'a'." },
  { name:"Romania", flag:"🇷🇴", region:"Europe", lang:"Romanian", hello:"Bună ziua", script:"BOO-nuh ZEE-wah", fact:"Romanian is a Romance language descended from Latin, making it closely related to French, Italian and Spanish." },
  { name:"Japan", flag:"🇯🇵", region:"Asia", lang:"Japanese", hello:"こんにちは", script:"kon-nee-chee-WAH", fact:"Japanese has three writing systems used simultaneously: Hiragana, Katakana, and Kanji." },
  { name:"China", flag:"🇨🇳", region:"Asia", lang:"Mandarin", hello:"你好", script:"nee-HOW", fact:"Mandarin Chinese has over 1 billion speakers and uses tones — the same syllable means different things depending on pitch." },
  { name:"South Korea", flag:"🇰🇷", region:"Asia", lang:"Korean", hello:"안녕하세요", script:"ahn-NYONG-ha-se-yo", fact:"The Korean alphabet Hangul was invented in 1443 by King Sejong and can be learned in just a few hours." },
  { name:"India", flag:"🇮🇳", region:"Asia", lang:"Hindi", hello:"नमस्ते", script:"nah-mah-STAY", fact:"India has 22 officially recognised languages and over 19,500 distinct dialects spoken across the country." },
  { name:"Pakistan", flag:"🇵🇰", region:"Asia", lang:"Urdu", hello:"سلام", script:"sah-LAAM", fact:"Urdu is written right to left in the Nastaliq script and shares much of its grammar with Hindi." },
  { name:"Saudi Arabia", flag:"🇸🇦", region:"Asia", lang:"Arabic", hello:"مرحبا", script:"mar-HAH-bah", fact:"Arabic is written right to left and is the liturgical language of Islam, spoken by over 420 million people." },
  { name:"Turkey", flag:"🇹🇷", region:"Asia", lang:"Turkish", hello:"Merhaba", script:"mer-HAH-bah", fact:"Turkish uses vowel harmony — vowels in suffixes must match the vowels of the root word." },
  { name:"Thailand", flag:"🇹🇭", region:"Asia", lang:"Thai", hello:"สวัสดี", script:"sah-WAD-dee", fact:"Thai is a tonal language with 5 tones. It has its own unique script with 44 consonants and 15 vowel symbols." },
  { name:"Indonesia", flag:"🇮🇩", region:"Asia", lang:"Indonesian", hello:"Halo", script:"HAH-loh", fact:"Indonesian has no verb conjugations, no plural forms, and no grammatical gender — making it relatively easy to learn." },
  { name:"Egypt", flag:"🇪🇬", region:"Africa", lang:"Arabic", hello:"أهلاً", script:"AH-lan", fact:"Modern Egyptian Arabic is the most widely understood Arabic dialect due to Egypt's influential film and music industry." },
  { name:"Nigeria", flag:"🇳🇬", region:"Africa", lang:"English / Yoruba", hello:"Bawo ni", script:"BAH-woh-nee (Yoruba)", fact:"Nigeria has over 500 languages, making it one of the most linguistically diverse countries on Earth." },
  { name:"Ethiopia", flag:"🇪🇹", region:"Africa", lang:"Amharic", hello:"ሰላም", script:"sah-LAM", fact:"Amharic uses the Ge'ez script, one of the world's oldest alphabets still in active use today." },
  { name:"South Africa", flag:"🇿🇦", region:"Africa", lang:"Zulu / 11 official", hello:"Sawubona", script:"sah-woo-BOH-nah", fact:"South Africa has 11 official languages — the most of any country in the world." },
  { name:"Kenya", flag:"🇰🇪", region:"Africa", lang:"Swahili", hello:"Habari", script:"hah-BAR-ee", fact:"Swahili is spoken by over 200 million people across East Africa and was spread by Arab traders centuries ago." },
  { name:"Morocco", flag:"🇲🇦", region:"Africa", lang:"Arabic / Berber", hello:"مرحبا", script:"mar-HAH-bah", fact:"Morocco's Berber language Tamazight was given official status in 2011." },
  { name:"Haiti", flag:"🇭🇹", region:"Americas", lang:"Haitian Creole", hello:"Bonjou", script:"bon-ZHOO", fact:"Haitian Creole developed from French mixed with West African languages." },
  { name:"Brazil", flag:"🇧🇷", region:"Americas", lang:"Portuguese", hello:"Olá", script:"oh-LAH", fact:"Brazil is the only Portuguese-speaking country in the Americas." },
  { name:"Mexico", flag:"🇲🇽", region:"Americas", lang:"Spanish", hello:"Hola", script:"OH-lah", fact:"Mexico recognises 68 national languages including 63 indigenous ones." },
  { name:"USA", flag:"🇺🇸", region:"Americas", lang:"English", hello:"Hello", script:"HEH-loh", fact:"The United States has no official national language. Over 350 languages are spoken there." },
  { name:"Canada", flag:"🇨🇦", region:"Americas", lang:"English / French", hello:"Hello / Bonjour", script:"HEH-loh / bohn-ZHOOR", fact:"Canada is officially bilingual — English and French." },
  { name:"Argentina", flag:"🇦🇷", region:"Americas", lang:"Spanish", hello:"Hola", script:"OH-lah", fact:"Argentinian Spanish uses 'vos' instead of 'tú' and has a distinctive Italian-influenced accent." },
  { name:"Australia", flag:"🇦🇺", region:"Oceania", lang:"English", hello:"G'day", script:"g-DAY", fact:"Australia has over 250 Indigenous language groups, though many are now endangered." },
  { name:"New Zealand", flag:"🇳🇿", region:"Oceania", lang:"English / Māori", hello:"Kia ora", script:"KEE-ah-OR-ah", fact:"Māori is a Polynesian language. 'Kia ora' literally means 'be well'." },
  { name:"Papua New Guinea", flag:"🇵🇬", region:"Oceania", lang:"Tok Pisin", hello:"Gude", script:"GOO-day", fact:"Papua New Guinea has over 800 languages in a population of just 10 million people." },
];

const regions = ["All","Europe","Asia","Africa","Americas","Oceania"];
let activeRegion = "All";
let searchVal = "";

const regionsEl = document.getElementById("regions");
regions.forEach(r => {
  const btn = document.createElement("button");
  btn.className = r === "All"
    ? "btn btn-primary btn-sm rounded-pill"
    : "btn btn-outline-secondary btn-sm rounded-pill";
  btn.textContent = r === "All" ? "All regions" : r;
  btn.onclick = () => {
    activeRegion = r;
    document.querySelectorAll("#regions button").forEach(b => {
      b.className = "btn btn-outline-secondary btn-sm rounded-pill";
    });
    btn.className = "btn btn-primary btn-sm rounded-pill";
    renderCards();
  };
  regionsEl.appendChild(btn);
});

function filterCards() {
  searchVal = document.getElementById("search-bar").value.toLowerCase();
  renderCards();
}

function renderCards() {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  grid.innerHTML = "";
  const filtered = countries.filter(c => {
    const matchRegion = activeRegion === "All" || c.region === activeRegion;
    const matchSearch = !searchVal || c.name.toLowerCase().includes(searchVal) || c.lang.toLowerCase().includes(searchVal);
    return matchRegion && matchSearch;
  });
  empty.style.display = filtered.length === 0 ? "block" : "none";
  document.getElementById("count").textContent = filtered.length + " countr" + (filtered.length === 1 ? "y" : "ies");
  filtered.forEach(c => {
    const div = document.createElement("div");
    div.className = "col-6 col-sm-4 col-md-3";
    div.innerHTML = `
      <div class="card h-100 country-card">
        <div class="card-body">
          <span style="font-size:28px;">${c.flag}</span>
          <h6 class="card-title mt-2 mb-1">${c.name}</h6>
          <small class="text-muted">${c.lang}</small>
        </div>
      </div>`;
    div.querySelector(".card").onclick = () => openPanel(c);
    grid.appendChild(div);
  });
}

function openPanel(c) {
  document.getElementById("p-flag").textContent = c.flag;
  document.getElementById("p-name").textContent = c.name;
  document.getElementById("p-badge").textContent = c.lang;
  document.getElementById("p-hello").textContent = c.hello;
  document.getElementById("p-script").textContent = "Pronounced: " + c.script;
  document.getElementById("p-fact").textContent = c.fact;
  document.getElementById("overlay").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closePanel() {
  document.getElementById("overlay").classList.remove("show");
  document.body.style.overflow = "";
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById("overlay")) closePanel();
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

renderCards();
</script>
</body>
</html>
